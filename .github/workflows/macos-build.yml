name: build-macos

# 构建 run-cam 的 macOS 自包含二进制(静态链接 libusb/readline),
# 产出可直接下载发给同事的可执行文件(arm64 / x86_64 / universal 三种)。

on:
  push:
    branches: [ main ]
    paths:
      - 'run-cam/**'
      - '.github/workflows/macos-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14   # Apple Silicon
            arch: arm64
          - runner: macos-13   # Intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: run-cam
    steps:
      - uses: actions/checkout@v4

      - name: Install libusb & readline
        run: brew install libusb readline

      - name: Build self-contained binary (DIST=1 静态链接)
        run: make DIST=1

      - name: Verify no Homebrew runtime dependency
        run: |
          echo "otool -L build/uvc-tool:"
          otool -L build/uvc-tool
          if otool -L build/uvc-tool | grep -E '/opt/homebrew|/usr/local/opt|/usr/local/Cellar'; then
            echo "::error::二进制仍依赖 Homebrew 动态库, 静态链接失败"
            exit 1
          fi
          echo "OK: 仅依赖系统库, 可脱离 Homebrew 运行。"

      - name: Smoke test (启动并退出)
        run: printf '0\n' | ./build/uvc-tool || true

      - name: Rename per arch
        run: mv build/uvc-tool build/uvc-tool-macos-${{ matrix.arch }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: uvc-tool-macos-${{ matrix.arch }}
          path: run-cam/build/uvc-tool-macos-${{ matrix.arch }}
          if-no-files-found: error

  universal:
    name: universal (arm64 + x86_64)
    needs: build
    runs-on: macos-14
    steps:
      - name: Download arch binaries
        uses: actions/download-artifact@v4
        with:
          pattern: uvc-tool-macos-*
          path: dist
          merge-multiple: true

      - name: lipo into universal binary
        run: |
          ls -la dist
          lipo -create \
            dist/uvc-tool-macos-arm64 \
            dist/uvc-tool-macos-x86_64 \
            -output dist/uvc-tool-macos-universal
          chmod +x dist/uvc-tool-macos-universal
          echo "--- file ---"; file dist/uvc-tool-macos-universal
          echo "--- lipo -info ---"; lipo -info dist/uvc-tool-macos-universal

      - name: Upload universal artifact
        uses: actions/upload-artifact@v4
        with:
          name: uvc-tool-macos-universal
          path: dist/uvc-tool-macos-universal
          if-no-files-found: error
